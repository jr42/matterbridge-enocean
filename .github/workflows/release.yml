name: Release

# Publishes to npm when a version tag (v*) is pushed.
#
# Authentication uses npm "trusted publishing" (OIDC) — no NPM_TOKEN secret. The npm package
# must have this repository + workflow registered as a trusted publisher:
#   npmjs.com -> matterbridge-enocean -> Settings -> Trusted Publisher -> GitHub Actions
#     organization or user: jr42
#     repository:           matterbridge-enocean
#     workflow filename:    release.yml
# Provenance is attached automatically when publishing via OIDC.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 24 ships an older 11.x.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # See ci.yml — matterbridge is provided at runtime, not depended on; link it for the build.
      - name: Install and link matterbridge
        run: |
          npm install -g matterbridge
          npm link matterbridge

      - name: Verify package version matches tag
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}" >&2
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # prepublishOnly runs cleanBuildProduction; OIDC supplies auth + provenance.
      - name: Publish to npm
        run: npm publish --access public
