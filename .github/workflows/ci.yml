name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # matterbridge is intentionally NOT a (dev)dependency of the plugin (a Matterbridge
      # plugin must not bundle or depend on the host). It is provided at runtime by the
      # Matterbridge installation; for type-checking/build/test we install it globally and
      # link it, mirroring the local `npm run dev:link` workflow.
      - name: Install and link matterbridge
        run: |
          npm install -g matterbridge
          npm link matterbridge

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
